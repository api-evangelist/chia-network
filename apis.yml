aid: chia-network
name: Chia Network
description: >-
  Chia Network is the company behind an open-source, decentralized blockchain that
  uses a Proof of Space and Time consensus model, letting participants "farm" with
  unused disk space instead of energy-intensive mining. Its reference implementation,
  chia-blockchain, runs a full node, farmer, harvester, timelord, and wallet, and
  exposes a set of local, TLS-certificate-secured JSON RPC services (full node, wallet,
  farmer, harvester, DataLayer, crawler, timelord, solver, and a WebSocket daemon)
  alongside the `chia` command-line interface and the Chialisp smart-contract language.
  Chia also builds tooling for tokenized carbon and climate applications (Climate
  Action Data Trust). The developer surface centers on the RPC APIs, official Python
  and Rust packages, and an extensive GitHub organization rather than a public hosted API.
