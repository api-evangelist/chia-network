apis:
- name: Chia RPC API
  description: >-
    Local JSON-over-HTTPS RPC surface exposed by the chia-blockchain reference node.
    Each service (full_node, wallet, farmer, harvester, datalayer, crawler, timelord,
    solver) listens on its own port and is secured with TLS client certificates; the
    daemon additionally routes RPCs over WebSocket. Intended to run on localhost.
  humanURL: https://docs.chia.net/rpc/
  baseURL: https://localhost:8555
